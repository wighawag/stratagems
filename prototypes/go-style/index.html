<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>PROTOTYPE: stratagems on a Go board (pixi.js)</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
			html, body { margin: 0; height: 100%; overflow: hidden; font: 13px/1.35 system-ui, sans-serif; }
			#board { position: fixed; inset: 0; }
			.panel { position: fixed; background: rgba(24, 18, 12, 0.88); color: #f4ead8; border-radius: 10px; padding: 10px 12px; box-shadow: 0 4px 18px rgba(0,0,0,.35); }
			#controls { top: 10px; left: 10px; width: 270px; }
			#controls h1 { font-size: 13px; margin: 0 0 6px; color: #ffcf70; letter-spacing: .02em; }
			#controls label { display: block; margin: 2px 0; cursor: pointer; }
			#controls .row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
			button { background: #f4ead8; color: #2a1a08; border: 0; border-radius: 6px; padding: 4px 9px; cursor: pointer; font: inherit; }
			button.primary { background: #ffcf70; font-weight: 600; }
			#card { top: 10px; right: 10px; display: none; gap: 10px; align-items: center; }
			#card .addr { font-family: ui-monospace, monospace; }
			#card .sw span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 3px; border: 1px solid #000; }
			#card .hint { opacity: .6; font-size: 11px; }
			#status { position: fixed; left: 10px; bottom: 10px; color: #2a1a08; font: 11px ui-monospace, monospace; opacity: .75; }
			#switcher { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; background: #111; color: #fff; border-radius: 999px; padding: 6px 10px; box-shadow: 0 6px 20px rgba(0,0,0,.45); border: 2px solid #ffcf70; }
			#switcher button { background: #333; color: #fff; border-radius: 999px; }
			.legend { font-size: 11px; opacity: .8; margin-top: 6px; }
		</style>
	</head>
	<body>
		<div id="board"></div>
		<div id="controls" class="panel">
			<h1>PROTOTYPE, throwaway: life on a Go board</h1>
			<label><input type="radio" name="v" id="v-a" /> A: dial of seven marks</label>
			<label><input type="radio" name="v" id="v-b" /> B: stone size only</label>
			<label><input type="radio" name="v" id="v-c" /> C: cracks, no dial</label>
			<hr style="border-color:#5a4a36" />
			<label><input type="checkbox" id="links" /> Bridges and notches (B)</label>
			<label><input type="checkbox" id="owners" /> Owners overlay (O)</label>
			<label><input type="checkbox" id="outlines" /> Owner group outlines (G, with Owners)</label>
			<div class="row">
				<button id="z-near">Near (1)</button><button id="z-mid">Mid (2)</button><button id="z-far">Far (3)</button>
			</div>
			<div class="row">
				<button id="turn" class="primary">Turn the cycle (T)</button><button id="reset">Reset (R)</button><button id="hide">Hide (H)</button>
			</div>
			<div class="legend">Drag to pan, wheel to zoom. Hover a stone to see its owner, tap to pin.<br />Glow + pulsing next mark: grows. Red rim + flickering mark: shrinks. Bridge: friend. Red pinch: enemy contact.</div>
		</div>
		<div id="card" class="panel"></div>
		<div id="status"></div>
		<div id="switcher"><button id="prev">&larr;</button><span id="variant-label"></span><button id="next">&rarr;</button></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
