packages:
  - "web"
  - "contracts"
  - "helper-services/*"

# pnpm settings live in this file, not in package.json's "pnpm" field: pnpm 10
# reads them from either place, pnpm 11 only from here (it ignores the field and
# warns about it). esbuild's install script only checks its platform binary.
onlyBuiltDependencies:
  - esbuild

overrides:
  # cookie@<0.7.0 (GHSA-pxg6-pf52-xh8x, low): @sveltejs/kit declares cookie ^0.6.0
  # and 2.70.2 is the latest release, so there is no upstream version to bump to;
  # the usual fix-at-source route does not exist yet. Not reachable here in any
  # case: web is adapter-static so there is no server runtime, web/package.json
  # declares no dependencies at all, and cookie appears in zero files of the
  # built client bundle. The override exists so projects scaffolded from this
  # template do not inherit the vulnerable resolution. Range key rather than a
  # bare name, so it disarms itself once SvelteKit moves past 0.6.x: delete it then.
  'cookie@<0.7.0': '^0.7.0'

packageExtensions:
  # drand-client@1.2.5 (fuzd > tlock-js > drand-client) imports
  # @noble/hashes/sha256 without declaring @noble/hashes, so it resolves
  # whichever version pnpm hoists into node_modules/.pnpm/node_modules. Here
  # that is 1.x and it works by luck: as soon as anything in a workspace built
  # on this branch needs @noble/hashes 2.x (which has no ./sha256 export), 2.x
  # can be the hoisted one and fuzd crashes at startup with
  # ERR_PACKAGE_PATH_NOT_EXPORTED. It did, on with/fuzd-pixi-indexer, where
  # micro-eth-signer brings in 2.2.0. Declaring the dependency pins it to 1.x
  # whatever else gets hoisted. Delete once drand-client declares it itself.
  'drand-client@1':
    dependencies:
      '@noble/hashes': '^1.4.0'
